# .github/workflows/release-drafter.yml

name: Release Drafter

on:
  # Обновляем черновик когда что-то мёрджится в main
  push:
    branches: [ main ]

  # Обновляем черновик когда PR в main открывается/обновляется —
  # это позволяет видеть будущую версию ещё до мёрджа
  pull_request:
    types: [ opened, reopened, synchronize, labeled, unlabeled ]
    branches: [ main ]

  # Ручной запуск для пересборки черновика
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-release-draft:
    name: Update release draft
    runs-on: ubuntu-latest
    steps:
      - name: Draft next release
        uses: release-drafter/release-drafter@v7
        with:
          config-name: release-drafter.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}