# .github/release-drafter.yml

name-template: '$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  - title: '💥 Breaking Changes'
    labels: ['💥 Breaking Change']

  - title: '✨ Features'
    labels: ['✨ Feature']

  - title: '🐛 Bug Fixes'
    labels: ['🐛 Bug']

  - title: '⚡️ Performance'
    labels: ['⚡️ Performance']

  - title: '🔄 Refactor'
    labels: ['🔄 Refactor']

  - title: '🧹 Chore & Dependencies'
    labels: ['🧹 Chore', '🤖 Dependencies']

  - title: '🧪 Tests & CI'
    labels: ['🧪 Testing', '🛡️ Infrastructure / CI']

  - title: '📚 Documentation'
    labels: ['📚 Documentation']

  - title: '🎨 Code Style'
    labels: ['🎨 Code Style']

# Каждый PR попадает ровно в одну категорию — первую совпавшую
# Changelog строится из заголовков коммитов PR через $TITLE
change-template: '- $TITLE @$AUTHOR (#$NUMBER)'
change-title-escapes: '\<*_&'

exclude-labels:
  - 'size: s'
  - 'size: m'
  - 'size: l'

exclude-contributors:
  - dependabot
  - dependabot[bot]

version-resolver:
  major:
    labels: ['💥 Breaking Change', '🔒 Security']
  minor:
    labels: ['✨ Feature']
  patch:
    labels:
      - '🐛 Bug'
      - '⚡️ Performance'
      - '🔄 Refactor'
      - '🧹 Chore'
      - '🤖 Dependencies'
      - '🧪 Testing'
      - '🛡️ Infrastructure / CI'
      - '📚 Documentation'
      - '🎨 Code Style'
  default: patch

template: |
  ## What's Changed

  $CHANGES

  **Full Changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION