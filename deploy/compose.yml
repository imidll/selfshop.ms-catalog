services:
  backend:
    image: ko.local/selfshop.ms-catalog:latest
    ports:
      - "${INIT__ENTRY__HTTP__PORT:-8080}:\
         ${INIT__ENTRY__HTTP__PORT:-8080}"
    restart: unless-stopped
    env_file: [ .env ]
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--spider",
              "http://localhost:${INIT__ENTRY__HTTP__PORT:-8080}/health/ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
